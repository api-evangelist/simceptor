aid: simceptor

name: Simceptor

image: https://simceptor.com/og-image.jpg

description: Simceptor provides a free no‑code mock API server that supports REST, SOAP, and WSDL, with conditional rules, AI‑native mocking via
  Model Context Protocol (MCP), and a playground for developers. It enables rapid creation, testing, and updating of mock endpoints, offering
  features like latency simulation, dynamic faker data, webhook forwarding, multi‑environment support, and integration with AI assistants such
  as Claude and Cursor.

